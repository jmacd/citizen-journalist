  - id: coastal-groundwater-guideline-reference
    asked_at: 2026-08-22T08:29:03-07:00
    question: What County groundwater guideline did the MUSD representative cite around 1:16 in the August 20 hearing, and what does it say?
    status: answered_with_scope_limit
    short_answer: >-
      GHD's Matt Kennedy cited the County of Mendocino Coastal Groundwater
      Development Guidelines, a Questa Engineering document dated July 1989
      and marked as adopted by the Board of Supervisors on November 21, 1989.
      Its adjoining-well test treats pumping as an adverse effect if projected
      drawdown exceeds 10 percent of existing drawdown under maximum-day
      pumping conditions, or if adjoining well yield falls below 90 percent of
      that property's maximum-day demand. The guideline then requires
      mitigation. This technical threshold does not, by itself, decide whether
      MUSD may serve emergency water, what its DDW permit authorizes, or which
      later permit conditions govern the project.
    findings:
      - claim: >-
          At approximately 01:15:47-01:16:29, Matt Kennedy read the adjoining-well
          criteria and named the County of Mendocino Coastal Groundwater
          Development Guidelines.
        source_id: hearing_video_2026_08_20
        timestamp: 01:15:47-01:16:29
        confidence: verified_from_recording
      - claim: >-
          The official guideline was prepared for Mendocino County Environmental
          Health by Questa Engineering Corporation, is dated July 1989, and is
          marked as adopted by the Board of Supervisors on November 21, 1989.
        source_id: county_1989_coastal_groundwater_guidelines
        pages: 1
        confidence: verified_from_official_record
      - claim: >-
          The guideline defines an adverse adjoining-well effect as more than
          10 percent of existing drawdown under maximum-day pumping demand or a
          decline below 90 percent of maximum-day demand for the adjoining
          property, and states that mitigation is required if either occurs.
        source_id: county_1989_coastal_groundwater_guidelines
        pages: 18
        confidence: verified_from_official_record
    unresolved:
