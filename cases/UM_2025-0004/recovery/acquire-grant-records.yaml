    query: mccsd.com board packets 2025
    method: CDX API query for mccsd.com/* snapshots
    result: >-
      Only older documents (2022–2024) archived; no 2025 board packets captured.
      No DWR amendment authorization accessible.
    status: negative

  - id: internet-archive-cdx-musd-2025
    date: 2026-08-22
    source: Internet Archive CDX
    query: mendocinousd.org board backup materials 2024–2026
    method: CDX API and snapshot retrieval for MUSD board materials page
    result: >-
      Board backup materials page snapshots return binary/compressed content.
      July 2025 board items archived (bond program, superintendent contract, LCAP)
      no water project materials found.
    status: negative

  - id: data-ca-gov-search
    date: 2026-08-22
    source: data.ca.gov (California Open Data Portal)
    method: Dataset search for drought relief grants and DWSRF agreements
    result: No drought relief grant or DWSRF agreement datasets with amendment-level detail found.
    status: negative

  - id: bing-search-agreement-number
    date: 2026-08-22
    source: Bing web search
    method: Exact-phrase web search
    query: '"4600014624 amendment"'
    result: Zero matching results.
    status: negative

  - id: musd-june-2023-special-meeting
    date: 2026-08-22
    source: MUSD Special Board Meeting June 28, 2023
    url: https://www.mendocinousd.org/files/user/160/file/6-28-23-Special-Meeting(4).pdf
    method: PDF text extraction (text-based PDF, Microsoft Word 2016 generated)
    result: >-
      Agenda for Resolution 2023-15 (Subsequent MND adoption and project approval).
      No D2202005 amendment on agenda; no grant agreement action item present.
      D2202005 mentioned only in the attached staff report as background context.
    status: negative

next_steps:

