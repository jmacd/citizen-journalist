      File PRA request to DWR for all executed amendments to Agreement 4600014624
      with MCCSD.  Reference the March 5, 2026 letter (DocuSign 75679030) and the
      specific deadline change (March 31, 2025 to March 31, 2026) to identify
      the target instrument precisely.
    contact: "Yuliya Osetrova, Yuliya.Osetrova@water.ca.gov, (916) 326-9938"
    canonical_draft: "cases/UM_2025-0004/records-requests.yaml#dwr-4600014624"

  - action: submit_pra_to_swrcb_dfa
    priority: high
    description: >-
      File PRA request to SWRCB Division of Financial Assistance for all executed
      amendments, revised exhibits, and written schedule approvals for DWSRF Agreement
      D2202005 with MUSD. Reference the October 30, 2026 construction-completion date
      stated in the March 2026 GHD memo.
    contact: "Gary Chan, gary.chan@waterboards.ca.gov, (916) 650-6874"
    canonical_draft: "cases/UM_2025-0004/records-requests.yaml#dfa-c-06-2300584-001c"

  - action: ocr_mccsd_board_packets
    priority: medium
    description: >-
      Install pdf2image + tesseract and OCR MCCSD board packets from 2024–2025 to search
      for any DWR amendment authorization buried in consent calendars or superintendent
      reports.
    note: >-
      The packet bodies have not yet been searched, so the negative minutes result
      does not establish that authorization or discussion is absent from the packets.

  - action: check_eol_approval_status
    priority: low
    description: >-
      Monitor DOF decision on DWR Extension of Liquidation (EOL) request submitted
      March 2026.  If approved, a further DWR Amendment 3 extending the UMBDR program
      two years would follow, creating yet another instrument to acquire.
