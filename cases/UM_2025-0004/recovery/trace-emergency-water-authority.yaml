  - id: existing-official-boundary-layers
    result: >-
    The corpus already contains the 2026 County MCCSD jurisdictional-boundary
    polygon and the State Water Board's verified 2021 CA2300584
    drinking-water-system-area MultiPolygon.
    limitation: >-
    An overlay can describe geometric intersection or separation only. The
    State Water Board warns that its layer is a general representation and
    not a binding legal document; neither geometry establishes customers,
    service commencement, LAFCo jurisdiction, or authority to serve.
acquisition_tasks:
  - id: operative_ddw_permit_and_plan
    custodian: State Water Resources Control Board, Division of Drinking Water
    records:
      - November 26, 2025 CA2300584 permit and incorporated documents.
      - Approved emergency dispensing, tanker filling, customer eligibility, and service geography.
  - id: lafco_project_determination
    custodian: Mendocino LAFCo
    records:
      - Section 56133 request, approval, exemption, or no-jurisdiction determination.
      - Project correspondence concerning MUSD, MCCSD, the Emergency Water Service Area, and Slaughterhouse Gulch.
    existing_request_draft: lafco-musd-mccsd-project
  - id: musd_corporate_authority
    custodian: Mendocino Unified School District
    records:
      - Board resolutions and minutes authorizing emergency supply to non-MUSD users.
      - Counsel opinions or statutory analyses supporting that authority.
      - Final customer application, fees, pickup, hauling, and delivery procedures.
  - id: county_delivery_administration
    custodian: Mendocino County Planning and Building Services
    records:
      - Final implementation protocol for Condition 18.
      - Records identifying the approving agency, supplier, pickup point, hauler, recipient, and delivery destination.
next_disposition: >-
