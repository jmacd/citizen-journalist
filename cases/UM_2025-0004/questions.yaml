  - id: emergency-water-layered-authority
    asked_at: 2026-08-22T09:06:12-07:00
    question: How do the Planning Commission's "can" or "shall" emergency-water condition, Water Board requirements, and LAFCo boundaries fit together?
    status: answered_with_missing_operating_permit
    short_answer: |-
      The agencies are regulating different acts, so the County condition cannot be read as the complete authority to supply water. The Planning Commission may limit a coastal permit and define when the approved project is eligible to dispense emergency water. Its adopted wording says water "can" be supplied; County counsel said changing that to "shall" could compel MUSD to dedicate its water to others without an impact analysis or MUSD's agreement. But either word remains a County land-use condition: it does not amend MUSD's drinking-water permit, grant MUSD general retail-water powers, or enlarge MCCSD's territory.

      The State Water Board had already identified the overlap. DDW said the new sources and facilities required a domestic-water-supply permit amendment. The Board's funding staff separately asked for an emergency-delivery plan covering triggers, available volume, allocations, number of users, source water, and effects on neighboring wells, and said the funded scope did not match the environmental project. Those are not minor details; they are the operating questions the County's "can" condition does not answer. Because the November 26, 2025 DDW permit is still missing, the corpus cannot yet tell whether emergency dispensing, tanker filling, eligible customers, and geography were actually authorized or conditioned by DDW.

      LAFCo's records concern MCCSD, not an "MUSD zone of influence." LAFCo confirmed MCCSD's active water and groundwater-management powers, but those powers are exercised within the District. Its 2020 review said MCCSD's sphere should be coterminous with its boundary and that, apart from wastewater service to Russian Gulch State Park, MCCSD provided no other out-of-agency services. By contrast, the County-created Emergency Water Service Area includes MCCSD plus an extension to the Slaughterhouse Gulch watershed. That County eligibility map is not an annexation, sphere amendment, DDW service area, or LAFCo approval.

      MUSD complicates the boundary question because it is a school district operating public-water system CA2300584, not MCCSD. The 2024 MOU says MUSD's source property is outside MCCSD's service area while MUSD distribution facilities extend into much of the village. The unresolved question is therefore not simply whether MCCSD crossed its boundary; it is what independent school-district authority and DDW permit terms allow MUSD to dispense water beyond its institutional users, and whether any MCCSD participation triggers LAFCo approval. No located public LAFCo record decides that project-specific question.
    findings:
      - claim: >-
          Adopted Condition 18 says stored water "can be supplied" by MUSD during
          specified drought conditions, subject to the Emergency Water Service
          Area, a 315,000-gallon reserve, and a 40,000-gallon daily cap.
        source_id: county_pc_2024_0019
        pages: 7
        confidence: verified_from_signed_resolution
      - claim: >-
          County counsel said "can" had appeared since the initial draft and in
          the 2024 adoption; changing it to "shall" raised concern that the County
          would require MUSD to dedicate its water to others without impact
          analysis or MUSD agreement.
        source_id: hearing_video_2026_08_20
        timestamp: 01:10:03-01:10:49
        confidence: verified_from_recording
      - claim: >-
          The State Water Board said MUSD needed a DDW domestic-water-supply
          permit amendment for the new or modified sources and system components.
        source_id: ddw_dfa_2023_comment_letter
        pages: 1
        confidence: verified_from_official_agency_letter
      - claim: >-
          Water Board funding staff said the financing scope and environmental
          project did not match and requested an emergency-delivery plan covering
          triggers, volume, allocation, users, sources, and neighboring-well
          effects.
        source_id: ddw_dfa_2023_comment_letter
        pages: 2
        confidence: verified_from_official_agency_letter
      - claim: >-
          LAFCo confirmed MCCSD's active water and groundwater-management powers,
          including beneficial-use water service and the Water Code groundwater
          program.
        source_id: lafco_2022_groundwater_authority
        pages: 1
        confidence: verified_from_official_lafco_letter
      - claim: >-
          LAFCo's 2020 review reported that MCCSD provided no out-of-agency
          service other than wastewater treatment for Russian Gulch State Park
          and recommended a sphere coterminous with the District boundary.
        source_id: mccsd_2020_msr_soi
        pages: 63, 68
        confidence: verified_from_adopted_msr_soi_record
      - claim: >-
          The County emergency-water condition extended eligibility beyond the
          MCCSD boundary to the Slaughterhouse Gulch watershed; the Coastal
          Commission staff treated that as the County's defined permit area.
        source_id: ccc_appeal_report
        pages: 27
        confidence: verified_from_official_commission_report
      - claim: >-
          The 2024 MOU says MUSD water-system assets on Little Lake Road are
          outside MCCSD's service area while MUSD distribution extends into the
          village and through much of the MCCSD service area; it limits
          non-MUSD/non-fire access to declared drought emergencies.
        source_id: mccsd_musd_2024_mou
        pages: 2, 3
        confidence: verified_from_executed_mou
    unresolved:
      - Obtain the operative November 26, 2025 DDW permit and incorporated operating conditions for CA2300584.
      - Obtain DDW's approved emergency-distribution, tanker-filling, customer-eligibility, and service-geography records.
      - Obtain any project-specific LAFCo advice, pre-application review, or determination concerning MCCSD participation or out-of-area service.
