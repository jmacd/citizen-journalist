  - id: drought-trigger-authorities
    asked_at: 2026-08-22T08:41:00-07:00
    question: How do Water Code section 13198(a) and MCCSD's Water Shortage Contingency Plan relate to the project's drought and overpumping conditions?
    status: answered_with_authority_limit
    short_answer: >-
      They are alternative event triggers, not a grant of water-service
      authority. Water Code §13198(a) defines a state drought scenario as a
      Governor's drought emergency or a State Water Board determination made
      through the specified notice and hearing process. The MCCSD plan uses
      local rainfall and indicator-well measurements to support Board
      declarations of Stages 1-4; Stage 3 brings mandatory conservation,
      a 20-percent allotment reduction, and possible moratoria on new extraction
      permits, drilling, and pump testing. The County permit tied emergency-water
      conditions to either §13198(a) or an MCCSD Stage 3 declaration. Neither
      trigger expands MUSD's DDW permit, proves authority to serve every parcel,
      or resolves who may receive hauled water.
    findings:
      - claim: >-
          Water Code §13198(a) defines a drought scenario through either a
          Governor's drought emergency proclamation or a State Water Board
          determination following the specified notice and, where feasible,
          public-hearing process.
        source_id: ca_water_code_13198_2026
        pages: 1
        confidence: verified_from_current_official_code
      - claim: >-
          MCCSD's adopted plan uses rainfall and indicator-well levels to classify
          Stages 1-4.
        source_id: mccsd_2020_water_shortage_plan
        pages: 18
        confidence: verified_from_official_plan
      - claim: >-
          The plan's Stage 3 management response includes mandatory conservation
          and a 20-percent reduction in groundwater allotments.
        source_id: mccsd_2020_water_shortage_plan
        pages: 22
        confidence: verified_from_official_plan
      - claim: >-
          The County's approved project analysis describes Water Code §13198(a)
          and an MCCSD Stage 3 Emergency as alternative triggers for the
          emergency-water condition.
        source_id: ccc_appeal_report
        pages: 27
        confidence: verified_from_official_commission_report
