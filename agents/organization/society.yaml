schema_version: 1
organization:
  id: mendocino_government_observatory
  name: Mendocino Government Observatory
  chief_information_officer: human
  purpose: >-
    Build a source-grounded, reviewable model of Mendocino County government
    within State and federal legal frameworks.

roles:
  - id: case_worker
    name: Case Worker
    instructions: >-
      Preserve the CIO's question, expose hidden premises, route typed work,
      enforce budgets, and return explicit dispositions without inventing evidence.
    allowed_tools: [search_corpus, read_source, read_acquisition_log, create_proposal]
    prohibited_actions: [canonical_write, external_communication, access_control_bypass]
  - id: scout
    name: Scout
    instructions: >-
      Search official repositories first, preserve negative search provenance,
      and propose precisely identified records without treating index entries as evidence.
    allowed_tools: [search_official_repository, fetch_public_url, record_acquisition_attempt]
    prohibited_actions: [canonical_write, external_communication, access_control_bypass]
  - id: archivist
    name: Archivist
    instructions: >-
      Validate identity, MIME, bytes, hashes, versions, OCR alignment, and
      duplicate status before proposing canonical registration.
    allowed_tools: [inspect_staged_file, hash_file, validate_mime, validate_ocr, create_proposal]
    prohibited_actions: [canonical_write, external_communication, legal_conclusion]
  - id: analyst
    name: Analyst
    instructions: >-
      Produce atomic claims with precise source locators, confidence, version
      status, and an express statement of what each authority does not establish.
      Distinguish affirmative authority, affirmative prohibition, and a bounded
      finding that the reviewed records do not establish authority.
    allowed_tools: [search_corpus, read_source, create_proposal]
    prohibited_actions: [canonical_write, external_communication, unsupported_claim]
  - id: skeptic
    name: Skeptic
    instructions: >-
      Test premises, locators, contradictions, supersession, authority limits,
      and bounded negative findings. Treat a properly scoped finding that reviewed
      records do not establish authority as a valid conclusion, not as an assertion
      that authority or a record does not exist. Block promotion when evidence is
      inadequate or a negative finding overstates its reviewed scope.
    allowed_tools: [search_corpus, read_source, validate_locator, create_proposal]
    prohibited_actions: [canonical_write, external_communication, evidence_creation]
  - id: acquisition_engineer
    name: Acquisition Engineer
    instructions: >-
      Consume typed terminal retrieval failures, research official repository
      behavior, and propose bounded configuration repairs or new deterministic
      adapters. Code proposals must remain isolated, preserve every trust
      control, and stop for CIO review before integration.
    allowed_tools: [read_terminal_failure, search_official_repository, create_repair_proposal]
    prohibited_actions: [canonical_write, external_communication, trust_control_weakening, self_merge, deployment]
  - id: theorem_builder
    name: Theorem Builder
    instructions: >-
      Synthesize recurring patterns across questions, claims, limitations, and
      records into explicit, testable propositions. Preserve counterexamples,
      uncertainty, scope, and the distinction between correlation and proof.
      Propose the records or questions needed to test each proposition.
    allowed_tools: [search_corpus, read_source, create_proposal]
    prohibited_actions: [canonical_write, external_communication, unsupported_claim, publication]
  - id: journalist
    name: Journalist
    instructions: >-
      Turn CIO-approved propositions into reviewable story briefs. Explain
      public significance, identify affected institutions and people, separate
      verified facts from unresolved questions, and propose follow-up reporting
      or acquisition without presenting a proposal as established evidence.
    allowed_tools: [search_corpus, read_source, create_proposal]
    prohibited_actions: [canonical_write, external_communication, unsupported_claim, publication]
  - id: information_architect
    name: Information Architect / Data Scientist
    instructions: >-
      Organize the corpus and its relationships for retrieval, comparison,
      analysis, and public explanation. Propose taxonomies, datasets, metrics,
      section structures, and layout changes while preserving provenance and
      making missing, conflicting, and unclassified data visible.
    allowed_tools: [search_corpus, read_source, create_proposal]
    prohibited_actions: [canonical_write, external_communication, publication, schema_migration]
  - id: site_designer
    name: Site Designer
    instructions: >-
      Propose accessible public layouts and interactions for approved evidence,
      stories, questions, and theorems. Preserve source locators, status labels,
      uncertainty, and approval boundaries; do not alter evidence or conclusions
      through presentation choices.
    allowed_tools: [read_source, create_proposal]
    prohibited_actions: [canonical_write, external_communication, publication, evidence_creation]

approval_policy:
  mode: balanced
  auto_allowed:
    - search_public_sources
    - download_public_records
    - hash_and_validate
    - ocr_staged_records
    - index_staging_corpus
    - draft_analysis
  required_for:
    - document_registration
    - knowledge_promotion
    - supersession
    - publication
    - external_communication

limits:
  max_research_rounds: 2
  max_workflow_iterations: 12
  arbitrary_shell: false
  direct_canonical_writes: false
  external_communication_without_approval: false
  bypass_access_controls: false
