name: Promote Observatory candidate

on:
  workflow_dispatch:
    inputs:
      staging_receipt:
        description: Complete JSON from an immutable watershop staging receipt
        required: true
        type: string
      production_image:
        description: Digest-pinned Observatory image built from the staged revision
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  promote:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Require default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "promotion must run from the default branch" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: observatory/requirements.runtime.lock

      - name: Install locked runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r observatory/requirements.runtime.lock
          python -m pip install -e observatory --no-deps

      - name: Write submitted staging receipt
        env:
          STAGING_RECEIPT: ${{ inputs.staging_receipt }}
        run: printf '%s\n' "${STAGING_RECEIPT}" > "${RUNNER_TEMP}/staging-receipt.json"

      - id: receipt
        name: Validate staging receipt
        env:
          MENDO_STAGING_RECEIPT_PUBLIC_KEY: ${{ vars.MENDO_STAGING_RECEIPT_PUBLIC_KEY }}
        run: |
          mendo-promote validate-receipt \
            --receipt "${RUNNER_TEMP}/staging-receipt.json" \
            --github-output "${GITHUB_OUTPUT}"

      - id: image
        name: Validate production image reference
        env:
          PRODUCTION_IMAGE: ${{ inputs.production_image }}
        run: |
          mendo-promote validate-image \
            --image "${PRODUCTION_IMAGE}" \
            --expected-image-repository \
              'ghcr.io/${{ github.repository }}-observatory' \
            --github-output "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image index
        run: |
          docker buildx imagetools inspect \
            '${{ steps.image.outputs.image }}' \
            --raw > "${RUNNER_TEMP}/image-index.json"
          docker pull '${{ steps.image.outputs.image }}'
          docker inspect '${{ steps.image.outputs.image }}' \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            > "${RUNNER_TEMP}/image-revision"

      - name: Create production candidate
        env:
          MENDO_STAGING_RECEIPT_PUBLIC_KEY: ${{ vars.MENDO_STAGING_RECEIPT_PUBLIC_KEY }}
        run: |
          mendo-promote create-candidate \
            --receipt "${RUNNER_TEMP}/staging-receipt.json" \
            --image-index "${RUNNER_TEMP}/image-index.json" \
            --output "${RUNNER_TEMP}/production-candidate.json" \
            --image '${{ steps.image.outputs.image }}' \
            --image-revision "$(cat "${RUNNER_TEMP}/image-revision")" \
            --expected-image-repository \
              'ghcr.io/${{ github.repository }}-observatory' \
            --promoted-by '${{ github.actor }}' \
            --source-repository '${{ github.repository }}' \
            --source-revision '${{ github.sha }}' \
            --source-ref '${{ github.ref }}' \
            --workflow-run-id '${{ github.run_id }}'

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: observatory-production-candidate-${{ steps.receipt.outputs.release_id }}
          path: |
            ${{ runner.temp }}/staging-receipt.json
            ${{ runner.temp }}/image-index.json
            ${{ runner.temp }}/image-revision
            ${{ runner.temp }}/production-candidate.json
          if-no-files-found: error
          retention-days: 90

      - name: Record candidate
        run: |
          {
            printf '### Observatory production candidate\n\n'
            printf -- '- Image: `%s`\n' '${{ steps.image.outputs.image }}'
            printf -- '- Release: `%s`\n' '${{ steps.receipt.outputs.release_id }}'
            printf -- '- Manifest: `%s`\n' '${{ steps.receipt.outputs.manifest_sha256 }}'
            printf -- '- Receipt: `%s`\n' '${{ steps.receipt.outputs.receipt_sha256 }}'
            printf '\nNo source or corpus artifact was rebuilt or deployed.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
