<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Mendocino Government Observatory system architecture</title>
  <desc id="desc">A Watershop-centered diagram showing public and private web applications, Python workflows, Foundry model calls, and persistent NFS and SQLite state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#315b63"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#8a5a19"/>
    </marker>
    <style>
      .bg { fill: #f7f8f5; }
      .watershop { fill: #e7f1f0; stroke: #126570; stroke-width: 3; }
      .service { fill: #fff; stroke: #315b63; stroke-width: 2; }
      .state { fill: #fff8dc; stroke: #9b711c; stroke-width: 2; }
      .external { fill: #eef2fa; stroke: #526aa3; stroke-width: 2; }
      .planned { fill: #f1f1f1; stroke: #888; stroke-width: 2; stroke-dasharray: 8 6; }
      .control { fill: #fff0df; stroke: #9a5a16; stroke-width: 2; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2925; }
      .title { font-size: 30px; font-weight: 750; }
      .subtitle { font-size: 16px; fill: #52615d; }
      .section { font-size: 18px; font-weight: 750; fill: #126570; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #52615d; }
      .legend { font-size: 13px; }
      .line { stroke: #315b63; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dline { stroke: #8a5a19; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow-dashed); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="50" y="55">Mendocino Government Observatory — current system</text>
  <text class="subtitle" x="50" y="83">Watershop is the single development instance. NFS and SQLite hold durable application state; model agents provide bounded judgment, not the system of record.</text>

  <!-- Watershop boundary -->
  <rect class="watershop" x="385" y="120" width="1165" height="875" rx="18"/>
  <text class="section" x="415" y="153">WATERSHOP HOST · persistent runtime</text>
  <text class="small" x="415" y="176">Caddy and user-level systemd run the services; application code is deployed from a pinned Git revision.</text>

  <!-- clients and sources -->
  <rect class="external" x="50" y="145" width="275" height="120" rx="10"/>
  <text class="label" x="70" y="177">Readers and CIO</text>
  <text class="body" x="70" y="202">Public readers ask bounded questions.</text>
  <text class="body" x="70" y="224">CIO reviews evidence and proposals.</text>
  <text class="small" x="70" y="247">Browser only; no direct state access</text>

  <rect class="external" x="50" y="330" width="275" height="150" rx="10"/>
  <text class="label" x="70" y="362">Official public sources</text>
  <text class="body" x="70" y="387">MuniCode, GovAccess, eTRAKiT,</text>
  <text class="body" x="70" y="409">NextRequest, Coastal Commission,</text>
  <text class="body" x="70" y="431">DDW, DWR, LAFCo, MUSD, MCCSD</text>
  <text class="small" x="70" y="457">Untrusted external inputs</text>

  <!-- edge services -->
  <rect class="service" x="425" y="205" width="310" height="125" rx="10"/>
  <text class="label" x="445" y="238">Caddy / private ingress</text>
  <text class="body" x="445" y="264">TLS, authentication, proxy headers</text>
  <text class="body" x="445" y="286">Routes to loopback services</text>
  <text class="small" x="445" y="310">Workbench is private; Casebook is read-only</text>

  <rect class="service" x="790" y="205" width="325" height="125" rx="10"/>
  <text class="label" x="810" y="238">Casebook · port 4174</text>
  <text class="body" x="810" y="264">Node/browser public question UI + API</text>
  <text class="body" x="810" y="286">Reads canonical corpus; queues gaps</text>
  <text class="small" x="810" y="310">Cannot acquire, register, approve, or publish</text>

  <rect class="control" x="1170" y="205" width="345" height="125" rx="10"/>
  <text class="label" x="1190" y="238">Workbench · port 4180</text>
  <text class="body" x="1190" y="264">Private CIO review and operations UI</text>
  <text class="body" x="1190" y="286">Consultations, approvals, candidates, activity</text>
  <text class="small" x="1190" y="310">Human authorization boundary</text>

  <!-- application services -->
  <rect class="service" x="425" y="390" width="310" height="180" rx="10"/>
  <text class="label" x="445" y="423">Evidence and case services</text>
  <text class="body" x="445" y="450">Python Workbench store/API</text>
  <text class="body" x="445" y="473">Node fetchers and casebook builders</text>
  <text class="body" x="445" y="496">OCR, hashing, MIME, duplicate checks</text>
  <text class="body" x="445" y="519">Deterministic citation and policy checks</text>
  <text class="small" x="445" y="548">Code is replaceable; stored records are not</text>

  <rect class="service" x="790" y="390" width="325" height="180" rx="10"/>
  <text class="label" x="810" y="423">MAF evidence workflow</text>
  <text class="body" x="810" y="450">Case Worker → retrieval → Scout</text>
  <text class="body" x="810" y="473">→ Archivist → Analyst → Skeptic</text>
  <text class="body" x="810" y="496">Bounded retries and explicit dispositions</text>
  <text class="body" x="810" y="519">CIO gates registration, promotion, publication</text>
  <text class="small" x="810" y="548">Agents propose; deterministic code validates</text>

  <rect class="service" x="1170" y="390" width="345" height="180" rx="10"/>
  <text class="label" x="1190" y="423">Consultation layer</text>
  <text class="body" x="1190" y="450">Theorem Builder: structured propositions</text>
  <text class="body" x="1190" y="473">Journalist: planned story briefs</text>
  <text class="body" x="1190" y="496">Information Architect: data organization</text>
  <text class="body" x="1190" y="519">Site Designer: case front-page drafts</text>
  <text class="small" x="1190" y="548">Only Theorem Builder execution is active today</text>

  <!-- state -->
  <rect class="state" x="425" y="635" width="310" height="250" rx="10"/>
  <text class="label" x="445" y="668">NFS: /home/citizen/journalist</text>
  <text class="body" x="445" y="696">archive/</text>
  <text class="body" x="465" y="718">immutable originals, releases, receipts</text>
  <text class="body" x="445" y="746">research/</text>
  <text class="body" x="465" y="768">staging bundles, queue, run state</text>
  <text class="body" x="465" y="790">checkpoints, consultation requests</text>
  <text class="body" x="445" y="818">cases/ and generated casebook data</text>
  <text class="small" x="445" y="854">Persistent across service restarts and redeploys</text>

  <rect class="state" x="790" y="635" width="325" height="250" rx="10"/>
  <text class="label" x="810" y="668">SQLite / FTS system of record</text>
  <text class="body" x="810" y="696">Documents, pages, locators, claims</text>
  <text class="body" x="810" y="720">Questions, gaps, directives, dispatches</text>
  <text class="body" x="810" y="744">Candidates, decisions, registrations</text>
  <text class="body" x="810" y="768">Consultations and proposal JSON</text>
  <text class="body" x="810" y="792">Raw model outputs and activity metadata</text>
  <text class="small" x="810" y="836">Operational state is durable, not evidence</text>
  <text class="small" x="810" y="856">Canonical evidence remains separately governed</text>

  <rect class="state" x="1170" y="635" width="345" height="250" rx="10"/>
  <text class="label" x="1190" y="668">Git repository / deployed source</text>
  <text class="body" x="1190" y="696">agents/ Python package and tests</text>
  <text class="body" x="1190" y="720">web/ browser UI</text>
  <text class="body" x="1190" y="744">cases/, skills/, organization/ policy</text>
  <text class="body" x="1190" y="768">Terraform and Watershop service units</text>
  <text class="body" x="1190" y="792">Pinned revision → deployed runtime</text>
  <text class="small" x="1190" y="836">Source changes require deployment</text>
  <text class="small" x="1190" y="856">Git is not the live research database</text>

  <!-- model -->
  <rect class="external" x="790" y="930" width="325" height="45" rx="10"/>
  <text class="label" x="815" y="959">Microsoft Foundry model service</text>
  <text class="small" x="815" y="976">No canonical evidence or durable case state</text>

  <!-- planned -->
  <rect class="planned" x="1170" y="930" width="345" height="45" rx="10"/>
  <text class="label" x="1190" y="959">Planned: Blob / AI Search / Speech</text>

  <!-- arrows -->
  <path class="line" d="M325 205 L425 250"/>
  <path class="line" d="M325 405 L425 475"/>
  <path class="line" d="M735 268 L790 268"/>
  <path class="line" d="M735 268 L1170 268"/>
  <path class="line" d="M952 330 L952 390"/>
  <path class="line" d="M1342 330 L1342 390"/>
  <path class="line" d="M580 570 L580 635"/>
  <path class="line" d="M952 570 L952 635"/>
  <path class="line" d="M1342 570 L1342 635"/>
  <path class="line" d="M735 760 L790 760"/>
  <path class="line" d="M1115 760 L1170 760"/>
  <path class="line" d="M952 885 L952 930"/>
  <path class="line" d="M1115 952 L1170 952"/>
  <path class="dline" d="M325 470 C520 600 620 920 790 950"/>
  <path class="dline" d="M1115 952 L1170 952"/>

  <!-- annotations -->
  <rect class="control" x="50" y="600" width="275" height="210" rx="10"/>
  <text class="label" x="70" y="633">How “stateless agents” work</text>
  <text class="body" x="70" y="660">1. App loads durable context.</text>
  <text class="body" x="70" y="684">2. Role receives bounded prompt.</text>
  <text class="body" x="70" y="708">3. Foundry returns a proposal.</text>
  <text class="body" x="70" y="732">4. App validates and stores output.</text>
  <text class="body" x="70" y="756">5. Next run reloads state and resumes.</text>
  <text class="small" x="70" y="784">Foundry does not own the case history.</text>

  <text class="legend" x="50" y="1050">Legend:</text>
  <rect class="state" x="110" y="1037" width="18" height="18"/><text class="legend" x="137" y="1051">persistent state</text>
  <rect class="service" x="270" y="1037" width="18" height="18"/><text class="legend" x="297" y="1051">active service</text>
  <rect class="control" x="420" y="1037" width="18" height="18"/><text class="legend" x="447" y="1051">CIO control</text>
  <rect class="external" x="550" y="1037" width="18" height="18"/><text class="legend" x="577" y="1051">external system</text>
  <rect class="planned" x="710" y="1037" width="18" height="18"/><text class="legend" x="737" y="1051">planned / not authoritative</text>
  <line x1="930" y1="1046" x2="980" y2="1046" class="line"/><text class="legend" x="990" y="1051">implemented data/control path</text>
  <line x1="1230" y1="1046" x2="1280" y2="1046" class="dline"/><text class="legend" x="1290" y="1051">planned or external retrieval</text>
</svg>
