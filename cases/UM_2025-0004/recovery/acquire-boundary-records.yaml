    repository: Mendocino County ArcGIS REST Services (ESRI ArcGIS Online hosted)
    url: https://services5.arcgis.com/8y4r60VTvWj2wnDH/arcgis/rest/services?f=json
    query: Full service catalog inventory
    attempted_at: 2026-08-22T05:00:00Z
    http_status: 200
    status: not_found
    result: >-
      Enumerated all 43 published feature services. Includes
      Community_Services_Districts, Water_Districts, Parcels_Public_,
      Planning_Partners_Map_WFL1, Zoning, Coastal_WFL1, FEMA_Flood_Hazard_Zones,
      and others. No layer named Emergency Water Service Area, EWSA, or
      equivalent is published. Water_Districts fields are OBJECTID, OWNER,
      ADDRESS, CITY, STATE, ZIP, SOURCE, DISTRICT_N — a district-boundary
      layer with no EWSA entry. Planning_Partners_Map_WFL1 contains Cities,
      Communities, School Districts, Fire Protection Districts, Harbor District,
      City Boundaries, and Mendocino County only.

  - id: county-arcgis-parcel-bbox-query-2026-08-22
    repository: Mendocino County ArcGIS Parcels_Public_ FeatureServer
    url: https://services5.arcgis.com/8y4r60VTvWj2wnDH/arcgis/rest/services/Parcels_Public_/FeatureServer/0/query
    query: >-
      geometryType=esriGeometryEnvelope, geometry lon -123.805 to -123.780,
      lat 39.306 to 39.315 (EWSA bounding box), inSR=4326,
      outFields=APN,APNFULL,SITUS_ADD,ACRES
    attempted_at: 2026-08-22T05:10:00Z
    http_status: 200
    status: data_available_polygon_needed
    result: >-
      Parcel layer is publicly queryable. 462 parcels returned in the EWSA
      bounding box. The layer fields include APN, APNFULL, SITUS_ADD,
      SITUS_CITY, SITUS_ZIP, CLASS_CD, ACRES, GEN_PLAN, GlobalID. However,
      the EWSA polygon geometry is required to execute a proper spatial
      intersection. Using the bounding box alone produces an over-inclusive
      result. Using the MCCSD boundary GeoJSON would also be over-inclusive
      as the EWSA is a distinct smaller polygon.
    note: >-
      A parcel intersection can be executed immediately once the native EWSA
      polygon is obtained, using a POST to the FeatureServer with
      geometryType=esriGeometryPolygon and spatialRel=esriSpatialRelIntersects.

