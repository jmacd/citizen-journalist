principles:
  - Search the issuing agency first, then official recipients and meeting packets, then public archives.
  - Record an agenda reference separately from the underlying instrument and governing-body action.
  - Treat blocked or missing files as identified_unretrieved, not reviewed evidence.
  - Validate MIME type, byte count, and SHA-256 before registering a capture.
  - Preserve Internet Archive timestamps and original URLs; use the id_ replay form for original binaries.
  - Record negative searches and false matches so they are not repeated as if they were new work.

