site_wide_block_analysis:
  affected_domain: mendocinocounty.gov
  block_type: Akamai WAF IP-based restriction
  akamai_reference: "18.ac2d3e17.1787377709.9fcc86d9"
  evidence: >-
    Every path tested under mendocinocounty.gov returned HTTP 403 with
    identical 440-byte Akamai error HTML. Adjacent documents known to be
    publicly posted also returned 403. The block is environment-specific,
    not document-specific.

transcript_corroboration:
  source_id: hearing_video_2026_08_20
  transcript_path: captures/cases/UM_2025-0004/transcript/august-20-2026-hearing.txt
  quotes_confirming_revised_resolution_existence:
    - "all items have been posted to the website"
    - "staff recommended condition 20 shown on screen and this was also in a staff memo posted on Tuesday"
    - "condition 14 in the most recently posted resolution"
    - "what you see before you today and we are recommending adoption of the revised resolution"
    - "Again, as I mentioned before, our recommendation is that the Planning Commission adopt the revised resolution"
    - "And then, nope, this is actually not the revised resolution."
  finding: >-
    The transcript confirms the revised resolution exists and was publicly
    posted on Tuesday August 18, 2026. It does not safely establish the exact
    text of that draft: speakers called stream restoration Condition 14,
    displayed hydrological-review language as proposed Condition 20, and also
    discussed the different pump-test Condition 20 in the adopted 2024
    resolution. The hearing was continued; no resolution was adopted.

