blockers:
  - >-
    All seven target originals are held exclusively in physical records at
    the California State Archives (AB 786 bill file), California Secretary
    of State (chaptering record), Mendocino County Clerk-Recorder-Elections
    (Measure A canvass), and MCCSD (Ordinances 90-1, 91-3, 92-2, 00-1,
    01-1, 04-1).  None are publicly available in any online digital
    repository searched.
  - >-
    Mendocino County government websites (elections, planning) returned
    HTTP 403 from this environment; direct portal access blocked.
  - >-
    The California leginfo.ca.gov pre-1999 archive does not include
    1987-88 session bill files.
provenance_note: >-
