          Document 79272 has not been directly reviewed. The hearing used the
          same number for different provisions and also discussed wording
          received after posting. Number matching would create a false semantic
          alignment.
      - id: um2025_august_19_oral_revision
        date: 2026-08-19
        status: proposed_wording_not_posted_not_adopted
        condition_count: 20
        evidence: hearing_record
        note: >-
          Coastal Commission staff sought exact pre-permit-issuance wording for
          the proposed hydrological-study review condition. No third posted resolution has
          been located.

diagnostic:
  summary: >-
    The observed 19-, 20-, and 21-condition counts refer to different document
    versions, not contradictory counts of one adopted resolution. PC 2024-0019
    is the signed 21-condition predecessor. The August 2026 initial modification
    draft has 19 conditions. Hearing references indicate that the August 18
    revision has 20, but its exact text and semantic alignment remain unresolved
    until document 79272 is reviewed. No resolution was adopted because the
    hearing was continued.
  current_legal_status: >-
    PC 2024-0019 remains the captured adopted condition set unless and until a
    later modification resolution is adopted and becomes effective.
