      It referred to an August 18 revised draft, not an adopted resolution. The
      operative captured predecessor is signed Resolution PC 2024-0019, adopted
      December 19, 2024 with 21 conditions. County document 79046 is a captured
      August 2026 initial draft with 19 conditions. County document 79272 was
